<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Tebak Kata</title>
<style>
:root{--bg:#101827;--panel:#1b2940;--ink:#f4f7fb;--muted:#b9c6d8;--accent:#a3e635;--pink:#f0abfc}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#263b5b,#101827 62%);font-family:system-ui,Segoe UI,sans-serif;color:var(--ink);display:grid;place-items:center;padding:18px}
.app{width:min(100%,620px);background:rgba(27,41,64,.96);border:1px solid #40516b;border-radius:24px;padding:24px;box-shadow:0 22px 70px #0008}
h1{margin:0;font-size:clamp(28px,6vw,42px);letter-spacing:.5px} .sub{color:var(--muted);margin:6px 0 20px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.pill{background:#263852;border-radius:999px;padding:8px 13px;font-size:14px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.level{border:1px solid #50627d;background:#263852;color:white;padding:12px 6px;border-radius:12px;font-weight:700;cursor:pointer}.level.active{background:var(--accent);color:#17220b;border-color:var(--accent)}
.card{background:#111d30;border-radius:18px;padding:20px;margin:16px 0}.tag{color:var(--pink);font-size:12px;font-weight:800;letter-spacing:1px}.clue{font-size:20px;line-height:1.45;margin:10px 0 4px}.word{letter-spacing:8px;font-size:26px;font-weight:800;color:var(--accent);text-align:center;margin:16px 0}
.row{display:flex;gap:9px}.row input{min-width:0;flex:1;background:#f7fafc;color:#172033;border:0;border-radius:12px;padding:14px;font-size:16px;outline:3px solid transparent}.row input:focus{outline-color:var(--accent)}button{font:inherit}.primary{background:var(--accent);color:#18230d;border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer}.secondary{background:#344965;color:white;border:1px solid #60738f;border-radius:12px;padding:11px 14px;cursor:pointer}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.msg{min-height:28px;margin:12px 0 0;color:var(--muted)}.good{color:#bef264}.bad{color:#fda4af}.hidden{display:none}.footer{font-size:12px;color:#93a4ba;text-align:center;margin-top:18px}
@media(max-width:430px){.app{padding:18px}.row{flex-direction:column}.levels{gap:6px}.level{font-size:13px}}
</style>
</head>
<body>
<main class="app">
  <h1>🎯 TEBAK KATA</h1>
  <p class="sub">Baca petunjuknya, temukan katanya, dan kumpulkan poin!</p>
  <div class="stats">
    <span class="pill">⭐ Skor: <b id="score">0</b></span>
    <span class="pill">❤️ Kesempatan: <b id="tries">6</b></span>
    <span class="pill">🏆 Level: <b id="levelName">Easy</b></span>
  </div>
  <div class="levels">
    <button class="level active" data-level="easy">Easy</button>
    <button class="level" data-level="medium">Medium</button>
    <button class="level" data-level="hard">Hard</button>
  </div>
  <section class="card">
    <div class="tag" id="category">KATEGORI: HEWAN</div>
    <div class="clue" id="clue">Aku hewan peliharaan yang suka mengeong.</div>
    <div class="word" id="masked">_ _ _ _</div>
    <div class="row">
      <input id="guess" type="text" autocomplete="off" placeholder="Ketik jawabanmu..." aria-label="Jawaban">
      <button class="primary" id="submit">TEBAK</button>
    </div>
    <div class="actions">
      <button class="secondary" id="hint">💡 Petunjuk tambahan</button>
      <button class="secondary" id="next">Lewati kata</button>
      <button class="secondary" id="restart">Ulangi game</button>
    </div>
    <p class="msg" id="message" aria-live="polite">Pilih level, lalu mulai menebak!</p>
  </section>
  <p class="footer">Setiap jawaban benar = 10 poin • Game Tebak Kata</p>
</main>
<script>
const bank={
 easy:[
  {w:"KUCING",c:"HEWAN",q:"Aku hewan peliharaan yang suka mengeong.",h:"Aku sering mengejar tikus."},
  {w:"PISANG",c:"BUAH",q:"Buah berwarna kuning yang kulitnya mudah dikupas.",h:"Monyet sering menyukainya."},
  {w:"BUKU",c:"BENDA",q:"Benda yang berisi kumpulan halaman untuk dibaca.",h:"Biasanya ada di perpustakaan."},
  {w:"HUJAN",c:"ALAM",q:"Air yang jatuh dari langit.",h:"Kita memakai payung saat ini turun."},
  {w:"PENSIL",c:"ALAT SEKOLAH",q:"Alat untuk menulis yang bisa dihapus.",h:"Ujungnya perlu diraut."}
 ],
 medium:[
  {w:"SEPEDA",c:"KENDARAAN",q:"Kendaraan roda dua yang digerakkan dengan kayuhan kaki.",h:"Tidak menggunakan bensin."},
  {w:"KELINCI",c:"HEWAN",q:"Hewan bertelinga panjang yang suka melompat.",h:"Suka makan wortel."},
  {w:"JENDELA",c:"BAGIAN RUMAH",q:"Bagian rumah yang membuat udara dan cahaya masuk.",h:"Biasanya memiliki kaca."},
  {w:"PELANGI",c:"ALAM",q:"Busur warna-warni yang sering terlihat setelah hujan.",h:"Memiliki tujuh warna."},
  {w:"KAMERA",c:"TEKNOLOGI",q:"Alat untuk mengambil foto atau merekam video.",h:"Ada lensa di bagian depannya."}
 ],
 hard:[
  {w:"PERPUSTAKAAN",c:"TEMPAT",q:"Tempat yang menyimpan banyak koleksi buku untuk dibaca atau dipinjam.",h:"Siswa sering datang ke sini untuk mencari referensi."},
  {w:"KEBUDAYAAN",c:"PENGETAHUAN",q:"Cara hidup, adat, dan hasil karya yang berkembang dalam masyarakat.",h:"Terkait tradisi dan warisan suatu daerah."},
  {w:"ASTRONOMI",c:"ILMU PENGETAHUAN",q:"Ilmu yang mempelajari benda-benda langit dan alam semesta.",h:"Mempelajari planet, bintang, dan galaksi."},
  {w:"EKOSISTEM",c:"LINGKUNGAN",q:"Hubungan timbal balik antara makhluk hidup dan lingkungannya.",h:"Terdiri dari komponen biotik dan abiotik."},
  {w:"KREATIVITAS",c:"KEMAMPUAN",q:"Kemampuan menghasilkan ide atau karya yang baru dan unik.",h:"Sangat dibutuhkan saat membuat sesuatu yang inovatif."}
 ]};
const config={easy:6,medium:5,hard:4};
let level="easy",score=0,tries=6,current=null,used=[],hintUsed=false,locked=false;
const $=id=>document.getElementById(id);
function pick(){
 const list=bank[level]; if(used.length===list.length)used=[];
 const choices=list.map((x,i)=>i).filter(i=>!used.includes(i));
 const i=choices[Math.floor(Math.random()*choices.length)];used.push(i);
 current=list[i];tries=config[level];hintUsed=false;locked=false;
 $("category").textContent="KATEGORI: "+current.c;
 $("clue").textContent=current.q;
 $("masked").textContent=current.w.split("").map(()=>"_").join(" ");
 $("tries").textContent=tries;$("levelName").textContent=level[0].toUpperCase()+level.slice(1);
 $("guess").value="";$("guess").disabled=false;$("submit").disabled=false;
 $("message").textContent="Masukkan jawabanmu. Semangat!";
 $("message").className="msg";$("guess").focus();
}
function update(){ $("score").textContent=score;$("tries").textContent=tries; }
function submit(){
 if(locked)return;
 const val=$("guess").value.trim().toUpperCase();
 if(!val){$("message").textContent="Ketik jawaban terlebih dahulu.";$("message").className="msg bad";return;}
 if(val===current.w){
  score+=hintUsed?5:10;locked=true;$("masked").textContent=current.w.split("").join(" ");
  $("message").textContent="Benar! 🎉 Kamu mendapat "+(hintUsed?5:10)+" poin. Tekan kata berikutnya dengan tombol Lewati kata.";$("message").className="msg good";
  $("guess").disabled=true;$("submit").disabled=true;
 }else{
  tries--; $("message").textContent=tries>0?"Belum tepat, coba lagi!":"Kesempatan habis. Jawabannya adalah "+current.w+". Tekan Lewati kata untuk lanjut.";
  $("message").className="msg bad";
  if(tries===0){locked=true;$("guess").disabled=true;$("submit").disabled=true;}
 }
 update();$("guess").value="";
}
$("submit").addEventListener("click",submit);
$("guess").addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
$("hint").addEventListener("click",()=>{
 if(hintUsed){$("message").textContent="Petunjuk tambahan sudah digunakan.";return;}
 hintUsed=true;$("message").textContent="💡 "+current.h+" (Poin jawaban benar menjadi 5).";
});
$("next").addEventListener("click",pick);
$("restart").addEventListener("click",()=>{score=0;used=[];update();pick();});
document.querySelectorAll(".level").forEach(b=>b.addEventListener("click",()=>{
 level=b.dataset.level;document.querySelectorAll(".level").forEach(x=>x.classList.toggle("active",x===b));used=[];pick();
}));
pick();update();
</script>
</body>
</html>
